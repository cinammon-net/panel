# cinammon.net customer websites: <name>-<id>.cinammon.net -> web hosting container.
# DNS: wildcard "*" A record proxied by Cloudflare. Exact subdomains (panel, billing...) have
# their own vhosts and win over this wildcard. Host map written by /usr/local/sbin/cinammon-sites-sync.

map $host $cin_site_target {
    hostnames;
    default "";
    include /etc/nginx/cinammon-sites.map;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.cinammon.net;

    location /.well-known/acme-challenge/ {
        root /var/www/cinammon-sites-acme;
    }

    location / {
        if ($cin_site_target = "") {
            return 302 https://cinammon.net;
        }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.cinammon.net;

    ssl_certificate /etc/nginx/ssl/cinammon-sites.crt;
    ssl_certificate_key /etc/nginx/ssl/cinammon-sites.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64m;

    if ($cin_site_target = "") {
        return 302 https://cinammon.net;
    }

    location / {
        proxy_pass http://$cin_site_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @site_down;
    }

    location @site_down {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>Web apagada</title><body style="background:#050508;color:#e8e8f2;font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><h1 style="color:#ff2d95">Esta web está apagada</h1><p>El servidor de hosting no está en marcha. Enciéndelo desde panel.cinammon.net.</p></div>';
    }
}
